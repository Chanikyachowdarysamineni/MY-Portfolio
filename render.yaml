services:
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    rootDir: server
    startCommand: npm start
    nodeVersion: 24
    # Do NOT specify buildCommand here - Render will auto-detect
    # render.yaml will work if used via blueprint deploy
    # For manual service creation, Render uses default build
    envVars:
      - key: NODE_ENV
        value: production
      # MONGO_URI and PORT should be set in Render dashboard
