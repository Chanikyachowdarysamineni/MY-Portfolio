services:
  - type: web
    name: portfolio-backend
    env: node
    plan: free
    rootDir: server
    startCommand: npm start
    buildCommand: npm install
    nodeVersion: 24
    # Environment variables configured in Render dashboard
    # Do not commit sensitive data here
    envVars:
      - key: NODE_ENV
        value: production
      # MONGO_URI and PORT should be set in Render dashboard environment variables
