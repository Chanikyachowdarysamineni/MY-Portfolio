services:
  - type: web
    name: portfolio-frontend
    env: static
    plan: free
    buildCommand: npm install && VITE_BACKEND_URL=https://portfolio-backend.onrender.com npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          name: portfolio-backend
          type: web
          property: url
          path: /api

  - type: web
    name: portfolio-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      # MONGO_URI and PORT must be set in Render Dashboard (Settings > Environment)
      # MongoDB Atlas Connection String format:
      # mongodb+srv://username:password@cluster.mongodb.net/portfolio
